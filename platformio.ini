; PlatformIO Project Configuration File for ESP32 38-Pin Micromouse
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Upload Settings
upload_speed = 460800
; upload_port = COM10   ; auto-detect (board is on COM9 on this PC)
; monitor_port = COM10

; Compiler & Debug Flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    pololu/VL53L0X @ ^1.3.1

